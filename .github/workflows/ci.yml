name: Kidney Transplant Kpi Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[api,test]"

    - name: Run Pytest Suite
      env:
        AUDIT_SECRET_KEY: ci-test-key-not-for-production
      run: |
        pytest -v

    - name: Compile Python sources
      run: python -m compileall -q agents kidney_transplant_kpi_agent cli.py kidney_tx_sentinel.py enrichment.py

    - name: Run Browser Logic Tests
      run: |
        node --check web/app.js
        node --check web/kpi.js
        node --test tests/web.test.cjs

    - name: Security SAST & Zero-PHI Audit
      env:
        AUDIT_SECRET_KEY: ci-test-key-not-for-production
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
