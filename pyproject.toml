[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kidney-transplant-kpi-engine"
version = "2.0.0"
description = "Synthetic-data generic threshold-rule demonstration and CLI/API"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1", "pydantic>=2,<3"]
test = ["pytest>=7,<10", "pydantic>=2,<3"]

[project.scripts]
kidney-transplant-kpi-engine = "kidney_transplant_kpi_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/kidney-transplant-kpi-agent"
Repository = "https://github.com/abusuraihsakhri/kidney-transplant-kpi-agent.git"
