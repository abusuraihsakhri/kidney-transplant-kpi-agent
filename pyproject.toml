[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kidney-transplant-kpi-engine"
version = "2.0.0"
description = "KidneyTx Sentinel: KDPI Donor Matching, Delayed Graft Function & Banff Rejection Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
kidney-transplant-kpi-engine = "kidney_transplant_kpi_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/kidney-transplant-kpi-engine"
Repository = "https://github.com/abusuraihsakhri/kidney-transplant-kpi-engine.git"
